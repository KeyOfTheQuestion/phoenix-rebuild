name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify the container boundary, HTTP acceptance and timeout cleanup
        run: python tests/container_smoke.py
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install optional notebook test tools
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Exercise the notebook in Chromium
        run: python tests/browser_smoke.py
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile the maintained implementation
        run: python -m compileall -q phoenix examples/reference examples/retention
      - name: Check the harness itself
        run: python -m unittest discover -s tests -v
      - name: Run independent HTTP acceptance
        run: python -m phoenix verify
      - name: Verify the separate retention and v1 migration pilot
        run: |
          python -m phoenix verify-retention
          python -m phoenix verify-retention --full
      - name: Replay the frozen contract-002 reference archive
        run: python tests/retention_archive_smoke.py
      - name: Audit historical evidence
        run: python -m phoenix audit
