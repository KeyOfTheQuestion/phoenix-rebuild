name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Compile the maintained implementation
        run: python -m compileall -q phoenix examples/reference
      - name: Check the harness itself
        run: python -m unittest discover -s tests -v
      - name: Run independent HTTP acceptance
        run: python -m phoenix verify
      - name: Audit historical evidence
        run: python -m phoenix audit
