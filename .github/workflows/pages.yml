name: Publish notebook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify code and evidence before publishing
        run: |
          python -m unittest discover -s tests -v
          python -m phoenix verify
          python -m phoenix verify-retention
          python -m phoenix verify-retention --full
          python -m phoenix audit
      - name: Verify the optional container runner before publishing
        run: python tests/container_smoke.py
      - name: Verify notebook interactions before publishing
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install --with-deps --only-shell chromium
          python tests/browser_smoke.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs
      - name: Publish the public evidence notebook
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
